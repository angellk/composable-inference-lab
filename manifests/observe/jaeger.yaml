# Jaeger all-in-one used directly as the OTLP trace backend.
# Its built-in OTLP receiver on 4317 (gRPC) / 4318 (HTTP) means a
# separate OpenTelemetry Collector isn't needed for this lab's scope.
apiVersion: v1
kind: Namespace
metadata:
  name: observe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observe
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.65.0
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observe
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
