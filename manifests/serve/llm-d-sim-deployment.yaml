# Verified working: a dummy model name puts llm-d-inference-sim into
# "Simulated Mode" with zero network/GPU dependencies. A real HuggingFace
# model name (as in the project's own example manifest) triggers a
# vllm-render tokenizer sidecar that needs real network/HF access.
# See docs/GOTCHAS.md, finding #2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-sim
  namespace: inference-lab
  labels:
    app: llm-d-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-sim
  template:
    metadata:
      labels:
        app: llm-d-sim
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        args: ["--model", "lab-dummy-model", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
