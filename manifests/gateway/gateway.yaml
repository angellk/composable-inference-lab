# The Gateway resource itself. agentgateway and the Gateway API Inference
# Extension CRDs must already be installed (see scripts/02-gateway.sh)
# before this is accepted. Referenced by name from the llm-d router chart
# via --set httpRoute.inferenceGatewayName=llm-d-inference-gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: inference-lab
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-inference-gateway
  namespace: inference-lab
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
